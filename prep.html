<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 quick questions | Next Lever</title>
<meta name="description" content="Answer 5 quick questions so Michael comes prepared to your free 15-minute audit.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://nextleverhq.com/prep.html">
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/config.js"></script>
</head>
<body>
<main>
<section class="page-hero"><div class="wrap">
  <a href="index.html"><img class="logo" src="assets/logo.jpg" alt="Next Lever" width="64" height="64"></a>
  <h1>Answer these 5 so I come prepared</h1>
  <p>The more you give me, the more I show you on the call. Rough answers are fine.</p>
</div></section>
<section class="alt"><div class="wrap">
  <div class="formcard" style="margin-top:0">
    <form id="prep-form" name="audit-prep" method="POST" action="https://formspree.io/f/mgaakrpk" accept-charset="UTF-8"
          data-endpoint="FORMSPREE_PREP_URL" data-next="prep-thanks.html" data-subject="Audit prep answers: {name}" data-subject-field="name">
      <input type="hidden" name="_subject" value="Audit prep answers">
      <div class="grid">
        <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
        <div class="field"><label for="email">Email (use the one you booked with)</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      </div>
      <div class="field"><label for="best_customer">1. Who&#x27;s your best customer?</label><textarea class="q" id="best_customer" name="best_customer" placeholder="The kind of client you&#x27;d clone if you could." required></textarea></div>
      <div class="field"><label for="how_found">2. How do customers find you?</label><textarea class="q" id="how_found" name="how_found" placeholder="Referrals, ads, content, partners, cold outreach..." required></textarea></div>
      <div class="field"><label for="close_rate">3. What % do you close?</label><textarea class="q" id="close_rate" name="close_rate" placeholder="Of the people who get a quote or a call. A rough number is fine." required></textarea></div>
      <div class="field"><label for="who_touches">4. Who touches each step?</label><textarea class="q" id="who_touches" name="who_touches" placeholder="Quote, follow-up, scheduling, delivery, invoice. Name the person or &quot;me&quot; for each." required></textarea></div>
      <div class="field"><label for="price_last_raised">5. What&#x27;s your price, and when did you last raise it?</label><textarea class="q" id="price_last_raised" name="price_last_raised" placeholder="" required></textarea></div>
      <div class="hp" aria-hidden="true">
        <label for="_gotcha">Leave this field empty</label>
        <input id="_gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button class="btn" type="submit">Send my answers</button>
      <p class="status" role="status" aria-live="polite"></p>
      <p class="legal">Used only to prepare your audit. See our <a href="privacy.html">Privacy Policy</a>.</p>
    </form>
  </div>
</div></section>
</main>
<footer><div class="wrap">© Next Lever
  <div class="flinks"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms &amp; SMS Terms</a><a href="index.html">Home</a></div>
</div></footer>
<script src="assets/site.js" defer></script>
</body>
</html>
